<svg viewBox="0 0 120 80" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Simple chat bubble - centered -->
    <rect
        x="25" y="6"
        width="70" height="50"
        rx="10" ry="10"
        stroke="#000000"
        stroke-width="5"
        fill="none"
    />

    <!-- Speech tail - triangle with rounded tip, left side vertical -->
    <path
        d="M38 56 L38 66 Q38 70 43 68 L52 56 Z"
        fill="#000000"
    />

    <!-- Three horizontal lines - top longest, middle shortest, bottom medium -->
    <line x1="36" y1="20" x2="62" y2="20" stroke="#000000" stroke-width="4" stroke-linecap="round" />
    <line x1="36" y1="31" x2="52" y2="31" stroke="#000000" stroke-width="4" stroke-linecap="round" />
    <line x1="36" y1="42" x2="58" y2="42" stroke="#000000" stroke-width="4" stroke-linecap="round" />

    <!-- Green checkmark - right side, vertically centered -->
    <path
        d="M66 32 L72 38 L86 22"
        stroke="#22C55E"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"
    />
</svg>
